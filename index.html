<style>

    --indigo-soft:#8CA2BC22;

    --moss-soft:#8FB08D22;

    --brass-soft:#D2AC6322;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --paper:#17140F;
  --paper-raised:#221E17;
  --ink:#EDE4CD;
  --ink-soft:#B3A98C;

  --accent:#A23327;
  --accent-soft:#A2332722;

  --indigo-soft:#33465E1c;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);

  font-family:var(--font-body);

}

button{font-family:inherit;}

}

.page{max-width:1320px;margin:0 auto;padding:0 24px 64px;}

/* ---------- header ---------- */
header.masthead{
  padding:40px 0 22px;
  border-bottom:1px solid var(--rule);
  display:flex;
  flex-wrap:wrap;

}
.masthead-title{display:flex;flex-direction:column;gap:6px;min-width:280px;}
.eyebrow{

}
h1{

}
.subtitle{

}
.stat-row{

.stat{

}
.stat .n{

/* ---------- toolbar ---------- */
.toolbar{

.chip-groups{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;}

.work-tree-head input[type="search"]{

<div class="page">
  <div id="loadError" style="display:none;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:10px 14px;margin:16px 0;font-size:13px;"></div>
  <header class="masthead">
    <div class="masthead-title">
      <span class="eyebrow">村上春樹 場所台帳 — 장소 아카이브</span>
      <h1>하루키 문학 지도</h1>
      <p class="subtitle">소설·에세이 속 장소를 근거 등급과 함께 정리한 원장(元帳). 별표는 서사적 핵심 무대, 색은 실존 여부를 뜻한다.</p>

    <span id="lastFilterInfo"></span>

<script>
let PLACES = [];

async function loadPlaces(){
  const errBox = document.getElementById("loadError");
  try {
    const res = await fetch("places.csv");
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    if(parsed.errors && parsed.errors.length){
      console.warn("CSV 파싱 경고:", parsed.errors);
    }
    const EXPECTED_FIELDS = 15;
    PLACES = parsed.data
      .filter(row => Object.keys(row).length > 0 && row.name)
      .map(row => {
        if(Object.keys(row).length !== EXPECTED_FIELDS){
          console.warn(`행 필드 수 불일치(${Object.keys(row).length}/${EXPECTED_FIELDS}):`, row.name);
        }
        return {
          name: row.name,
          lat: row.lat ? parseFloat(row.lat) : null,
          lng: row.lng ? parseFloat(row.lng) : null,
          address: row.address,
          category: row.category,
          work: row.work,
          evidence: row.evidence,
          grade: row.evidence_grade ? parseInt(row.evidence_grade, 10) : null,
          sources: (row.source_url||"").split("|").map(s=>s.trim()).filter(Boolean),
          status: row.status,
          my_note: row.my_note,
          key_location: row.key_location,
          source_type: row.source_type,
          region: row.region || "",
          poi_type: row.poi_type || "",
        };
      });
    PLACES.forEach((p,i)=>p.__idx=i);
    init();
  } catch(e) {
    console.error("places.csv 로딩 실패:", e);
    errBox.textContent = "places.csv를 불러오지 못했습니다: " + e.message;
    errBox.style.display = "block";
  }
}

const CAT_META = {
  'A_실존_작가': {label:'A · 실존/작가', color:'var(--indigo)', soft:'var(--indigo-soft)', short:'A'},
  'B_실존_작중언급': {label:'B · 실존/작중언급', color:'var(--moss)', soft:'var(--moss-soft)', short:'B'},
  'C_모티브추정': {label:'C · 모티브추정', color:'var(--brass)', soft:'var(--brass-soft)', short:'C'},
};
const TYPE_LABELS = {'소설':'소설','에세이/자전적':'에세이·자전적','영화':'영화'};

let state = {
  q:'',
  cats:new Set(),
  types:new Set(),
  grades:new Set(),
  regions:new Set(),
  excludedWorks:new Set(),
  starOnly:false,
  selected:null,
};

/* ---------- stat row ---------- */
function renderStats(){
  const total = PLACES.length;
  const withCoord = PLACES.filter(p=>p.lat!=null).length;
  const byCat = {};
  PLACES.forEach(p=>byCat[p.category]=(byCat[p.category]||0)+1);
  const stars = PLACES.filter(p=>p.key_location).length;
  const el = document.getElementById('statRow');
  el.innerHTML = [
    ['전체', total],
    ['좌표확보', withCoord],
    ['핵심장소', stars],
    ['A·실존작가', byCat['A_실존_작가']||0],
    ['B·작중언급', byCat['B_실존_작중언급']||0],
    ['C·모티브추정', byCat['C_모티브추정']||0],
  ].map(([l,n])=>`<div class="stat"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('');
}

/* ---------- work tree ---------- */
function buildWorkTree(){
  const tree = {'장편소설':new Set(), '단편집':new Map(), '에세이·자전적':new Set(), '영화':new Set()};
  PLACES.forEach(p=>{
    if(p.source_type==='소설'){
      if(p.work.includes(' - ')){
        const [coll, piece] = p.work.split(' - ').map(s=>s.trim());
        if(!tree['단편집'].has(coll)) tree['단편집'].set(coll, new Set());
        tree['단편집'].get(coll).add(piece);
      } else {
        tree['장편소설'].add(p.work);
      }
    } else if(p.source_type==='에세이/자전적'){
      tree['에세이·자전적'].add(p.work);
    } else if(p.source_type==='영화'){
      tree['영화'].add(p.work);
    }
  });
  return tree;
}

function workItemHTML(workName){
  const checked = state.excludedWorks.has(workName) ? '' : 'checked';
  return `<label class="wt-item" data-work="${escAttr(workName)}"><input type="checkbox" ${checked}> ${escHtml(workName)}</label>`;
}

function renderWorkTree(){
  const tree = buildWorkTree();
  const root = document.getElementById('workTree');
  let html = '';
  html += `<div class="wt-group"><div class="wt-group-label">장편소설</div>`;
  html += [...tree['장편소설']].sort().map(workItemHTML).join('');
  html += `</div>`;
  html += `<div class="wt-group"><div class="wt-group-label">단편집</div>`;
  [...tree['단편집'].keys()].sort().forEach(coll=>{
    html += `<div style="padding-left:0;font-size:12px;color:var(--ink-soft);margin-top:4px;">${escHtml(coll)}</div>`;
    html += [...tree['단편집'].get(coll)].sort().map(piece=>workItemHTML(`${coll} - ${piece}`)).join('');
  });
  html += `</div>`;
  html += `<div class="wt-group"><div class="wt-group-label">에세이·자전적</div>`;
  html += [...tree['에세이·자전적']].sort().map(workItemHTML).join('');
  html += `</div>`;
  html += `<div class="wt-group"><div class="wt-group-label">영화</div>`;
  html += [...tree['영화']].sort().map(workItemHTML).join('');
  html += `</div>`;
  root.innerHTML = html;
  root.querySelectorAll('.wt-item input').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const workName = e.target.closest('.wt-item').dataset.work;
      if(e.target.checked) state.excludedWorks.delete(workName);
      else state.excludedWorks.add(workName);
      update();
    });
  });
  applyWorkTreeSearch();
}

function applyWorkTreeSearch(){
  const q = (state.workTreeQuery||'').toLowerCase();
  document.querySelectorAll('.wt-item').forEach(el=>{
    const match = !q || el.dataset.work.toLowerCase().includes(q);
    el.classList.toggle('hidden-by-search', !match);
  });
}

document.getElementById('workTreeSearch').addEventListener('input', e=>{
  state.workTreeQuery = e.target.value.trim();
  applyWorkTreeSearch();
});
document.getElementById('workTreeToggleAll').addEventListener('click', ()=>{
  const allExcluded = PLACES.every(p=>state.excludedWorks.has(p.work));
  if(allExcluded) state.excludedWorks.clear();
  else PLACES.forEach(p=>state.excludedWorks.add(p.work));
  renderWorkTree();
  update();
});

/* ---------- chips ---------- */
function makeChip(container, key, label, group, colorVar){
  const b = document.createElement('button');
  b.className='chip';
  b.textContent=label;
  b.setAttribute('aria-pressed','false');
  if(colorVar) b.style.setProperty('--cat-color', colorVar);
  b.addEventListener('click',()=>{
    if(group.has(key)){group.delete(key);} else {group.add(key);}
    b.setAttribute('aria-pressed', group.has(key)?'true':'false');
    update();
  });
  container.appendChild(b);
  return b;
}
function renderChips(){
  const catGroup = document.getElementById('catGroup');
  Object.entries(CAT_META).forEach(([k,m])=>makeChip(catGroup,k,m.label,state.cats,m.color));
  const typeGroup = document.getElementById('typeGroup');
  Object.entries(TYPE_LABELS).forEach(([k,l])=>makeChip(typeGroup,k,l,state.types,null));
  const gradeGroup = document.getElementById('gradeGroup');
  [1,2,3].forEach(g=>makeChip(gradeGroup,g,'등급'+g,state.grades,null));
  const regionGroup = document.getElementById('regionGroup');
  const REGION_ORDER = ['간토','간사이','홋카이도','규슈','기타','해외'];
  const presentRegions = REGION_ORDER.filter(r=>PLACES.some(p=>p.region===r));
  presentRegions.forEach(r=>makeChip(regionGroup,r,r,state.regions,null));
}

document.getElementById('starChip').addEventListener('click', e=>{
  state.starOnly = !state.starOnly;
  e.target.setAttribute('aria-pressed', state.starOnly?'true':'false');
  update();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.q=''; state.cats.clear(); state.types.clear(); state.grades.clear();
  state.regions.clear(); state.excludedWorks.clear(); state.workTreeQuery=''; state.starOnly=false;
  document.getElementById('searchInput').value='';
  document.getElementById('workTreeSearch').value='';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
  renderWorkTree();
  update();
});
document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value.trim().toLowerCase();
  update();
});

/* ---------- filtering ---------- */
function filtered(){
  return PLACES.filter(p=>{
    if(state.cats.size && !state.cats.has(p.category)) return false;
    if(state.types.size && !state.types.has(p.source_type)) return false;
    if(state.grades.size && !state.grades.has(p.grade)) return false;
    if(state.regions.size && !state.regions.has(p.region)) return false;
    if(state.excludedWorks.has(p.work)) return false;
    if(state.starOnly && !p.key_location) return false;
    if(state.q){
      const hay = (p.name+' '+p.work+' '+p.evidence+' '+p.address).toLowerCase();
      if(!hay.includes(state.q)) return false;
    }
    return true;
  });
}

/* ---------- cards ---------- */
function gradeDots(g){
  if(!g) return '<span class="grade-dots">—</span>';
  let s='';
  for(let i=1;i<=3;i++) s += i<=g ? '●' : '○';
  return `<span class="grade-dots" title="근거등급 ${g}">${s}</span>`;
}
function cardHTML(p, idx){
  const meta = CAT_META[p.category] || {color:'var(--ink-soft)',soft:'transparent',short:'?'};
  const star = p.key_location ? `<span class="star">⭐</span>` : '';
  const coordTag = p.lat==null ? `<span class="no-coord-tag">좌표 미상</span>` : '';
  const sources = (p.sources||[]).filter(Boolean).map(u=>`<a href="${escAttr(u)}" target="_blank" rel="noopener">${escHtml(u)}</a>`).join('');
  return `
  <article class="card" data-id="${idx}" style="--cat-color:${meta.color};--cat-soft:${meta.soft}">
    <div class="card-top">
      <div class="card-name">${star}${escHtml(p.name)}</div>
      <div class="card-badges">
        <span class="badge">${meta.short}</span>
        ${gradeDots(p.grade)}
      </div>
    </div>
    <div class="card-meta">
      <span>${escHtml(p.work||'—')}</span>
      <span class="sep">·</span>
      <span>${TYPE_LABELS[p.source_type]||p.source_type||'—'}</span>
      <span class="sep">·</span>
      <span>${p.status}</span>
      ${coordTag}
    </div>
    ${p.key_location ? `<div class="card-key-reason">${escHtml(p.key_location)}</div>` : ''}
    <div class="card-evidence">${escHtml(p.evidence||'')}</div>
    <div class="card-detail">
      <div class="detail-row"><span class="k">주소</span><span class="v">${escHtml(p.address||'미상')}</span></div>
      <div class="detail-row"><span class="k">좌표</span><span class="v" style="font-family:var(--font-mono)">${p.lat!=null ? p.lat.toFixed(5)+', '+p.lng.toFixed(5) : '미상 — 절대 규칙에 따라 추측 좌표 미기재'}</span></div>
      ${p.my_note ? `<div class="detail-row"><span class="k">내 메모</span><span class="v"><div class="my-note">${escHtml(p.my_note)}</div></span></div>` : ''}
      ${sources ? `<div class="detail-row"><span class="k">출처</span><span class="v src-links">${sources}</span></div>` : ''}
    </div>
  </article>`;
}
function escHtml(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return escHtml(s);}

function renderCards(list){
  const wrap = document.getElementById('cards');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = `${list.length} / ${PLACES.length}건`;
  document.getElementById('listCount').textContent = `장소 목록 (${list.length}건)`;
  if(!list.length){ wrap.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  wrap.innerHTML = list.map(p=>cardHTML(p, p.__idx)).join('');
  wrap.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const idx = parseInt(card.dataset.id);
      const isExpanding = !card.classList.contains('expanded');
      wrap.querySelectorAll('.card.expanded').forEach(c=>{ if(c!==card) c.classList.remove('expanded'); });
      card.classList.toggle('expanded');
      selectPlace(idx, isExpanding, true);
    });
  });
}

/* ---------- leaflet map ---------- */
let leafletMap = null;
let markerLayer = null;
const markerRefs = new Map(); // __idx -> L.CircleMarker

function initMap(){
  leafletMap = L.map('leafletMap', {scrollWheelZoom:true}).setView([35.68, 139.75], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(leafletMap);
  markerLayer = L.layerGroup().addTo(leafletMap);
}

function resolveCssColor(varExpr){
  const m = varExpr.match(/var\((--[a-zA-Z0-9-]+)\)/);
  if(!m) return varExpr;
  return getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() || varExpr;
}

function renderMarkers(list){
  markerLayer.clearLayers();
  markerRefs.clear();
  list.filter(p=>p.lat!=null && p.lng!=null).forEach(p=>{
    const meta = CAT_META[p.category] || {color:'#9C9179'};
    const catColor = resolveCssColor(meta.color);
    const accentColor = resolveCssColor('var(--accent)');
    const radius = p.key_location ? 9 : 6;
    const isFood = p.poi_type === '식당카페';
    const marker = L.circleMarker([p.lat, p.lng], {
      radius,
      color: p.__idx===state.selected ? accentColor : catColor,
      weight: p.__idx===state.selected ? 2.5 : 1.2,
      fillColor: catColor,
      fillOpacity: 0.85,
      ...(isFood ? {radius: radius+2, dashArray:'2,2'} : {}),
    });
    marker.bindPopup(`<strong>${escHtml(p.name)}</strong><br>${escHtml(p.work||'')}`);
    marker.on('click', ()=>{
      const card = document.querySelector(`.card[data-id="${p.__idx}"]`);
      const isExpanding = !(card && card.classList.contains('expanded'));
      selectPlace(p.__idx, isExpanding, false);
    });
    marker.addTo(markerLayer);
    markerRefs.set(p.__idx, marker);
  });
}

function focusMarker(idx){
  const marker = markerRefs.get(idx);
  if(!marker) return;
  leafletMap.panTo(marker.getLatLng());
  marker.openPopup();
}

/* ---------- selection sync ---------- */
function selectPlace(idx, expand, fromCard){
  state.selected = expand ? idx : null;
  renderMarkers(filtered());
  if(expand) focusMarker(idx);
  if(!fromCard){
    const card = document.querySelector(`.card[data-id="${idx}"]`);
    if(card){
      document.querySelectorAll('.card.expanded').forEach(c=>{ if(c!==card) c.classList.remove('expanded'); });
      if(expand) card.classList.add('expanded');
      card.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('selected', parseInt(c.dataset.id)===idx && expand);
  });
}


/* ---------- init ---------- */
function update(){
  const list = filtered();
  renderCards(list);
  renderMarkers(list);
}
function init(){
  initMap();
  renderStats();
  renderChips();
  renderWorkTree();
  update();
}
loadPlaces();
</script>
